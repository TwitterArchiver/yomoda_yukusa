  1月1日下午，我登車返校，準備參加大二上期末考試。
  <br/>
  這是我最後的仍顯正常的學生時光。
  <br/>
  2日，眠墨按照約定與我見面。租一個月的出租屋。
  <br/>
  5日，考試結束。
  <br/>
  6日，我們急匆匆前往車站前往青島，分別在出租屋和宿舍留下大量物品。它們本來應該再也不會有人管的。
  <br/>
  在車站，碳酸鋇被攔下，但鈉鹽通過了安檢。
